# PerformCar EasyDevis : http://<serveur>:8082/
#   /api/  -> backend FastAPI (127.0.0.1:8020, REST + WebSocket)
#   /      -> frontend Next.js (127.0.0.1:3020)
# Installe par `./deploy.sh nginx`. La map $connection_upgrade est definie
# dans conf.d/hermes-ws-map.conf : ne pas la redeclarer.
server {
	listen 8082;
	listen [::]:8082;
	server_name _;
	server_tokens off;

	client_max_body_size 10m;

	access_log /var/log/nginx/performcar-access.log;
	error_log  /var/log/nginx/performcar-error.log;

	location /api/ {
		proxy_pass http://127.0.0.1:8020;
		proxy_http_version 1.1;
		proxy_set_header Upgrade           $http_upgrade;
		proxy_set_header Connection        $connection_upgrade;
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 3600s;
	}

	location / {
		proxy_pass http://127.0.0.1:3020;
		proxy_http_version 1.1;
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
