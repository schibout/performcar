# Profil Hermes "performcar" — assistant commercial PERFORM'CAR.
# Les secrets (clés API, identifiants EasyDevis) vont dans .env, jamais ici.

model:
  # Même modèle que les autres profils du serveur (abonnement openai-codex).
  # Changez-le avec `hermes model` ou `/model` si besoin.
  default: gpt-6-luna
  provider: openai-codex
  base_url: https://chatgpt.com/backend-api/codex

agent:
  # L'assistant n'a besoin ni d'exécuter des commandes ni de naviguer :
  # il travaille avec ses compétences et l'API EasyDevis (MCP).
  disabled_toolsets:
    - terminal
    - browser

approvals:
  mode: manual
  timeout: 300
  cron_mode: deny
  mcp_reload_confirm: true

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375

skills:
  config:
    performcar:
      # Fuseau horaire utilisé pour interpréter les dates souhaitées.
      timezone: Europe/Paris

mcp_servers:
  easydevis:
    # Serveur MCP local (stdio) qui appelle l'API EasyDevis au nom de
    # l'utilisateur connecté (ticket de conversation + clé de service).
    # Chemin du profil dans le conteneur Docker Hermes (/opt/data = ~/.hermes).
    # Le serveur lit EASYDEVIS_API_URL et EASYDEVIS_SERVICE_KEY dans le .env du
    # profil (la passerelle multi-profils ne résout pas toujours les ${...}).
    command: "uv"
    args: ["run", "--directory", "/opt/data/profiles/performcar/mcp/easydevis", "python", "server.py"]
    timeout: 60
    tools:
      include:
        - ma_concession
        - catalogue_vehicules
        - lister_prestations
        - rechercher_clients
        - simuler_financement
        - creer_devis
        - lister_devis
        - consulter_devis
        - changer_statut_devis
        - statistiques_devis
      prompts: false
      resources: false
