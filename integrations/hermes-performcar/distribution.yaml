name: performcar
version: 1.0.0
description: >-
  Assistant commercial PERFORM'CAR : conseil protection automobile (PPF XPEL,
  céramique SYSTEMX, vitres teintées, pare-brise) et création de devis dans
  PerformCar EasyDevis via MCP.
hermes_requires: ">=0.13.0"
author: PERFORM'CAR
license: Proprietary
env_requires:
  - name: EASYDEVIS_API_URL
    description: URL de l'API EasyDevis, préfixe /api/v1 inclus.
    required: true
    default: http://127.0.0.1:8000/api/v1
  - name: EASYDEVIS_SERVICE_KEY
    description: >-
      Clé de service partagée avec EasyDevis (ASSISTANT_SERVICE_KEY du backend). Avec le
      ticket de conversation, elle fait agir les outils au nom de l'utilisateur connecté.
    required: true
distribution_owned:
  - SOUL.md
  - config.yaml
  - skills/
  - mcp/
