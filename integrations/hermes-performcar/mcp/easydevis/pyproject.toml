[project]
name = "easydevis-mcp"
version = "1.0.0"
description = "Serveur MCP PerformCar EasyDevis pour le profil Hermes performcar"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.uv]
package = false
